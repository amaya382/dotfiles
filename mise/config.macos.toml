# macOS-only extras. Merged into the config chain automatically on macOS
# when auto_env = true is set in ~/.miserc.toml (see [dotfiles] entry in
# config.toml). Merging is additive with config.toml: keys form a union.

[bootstrap.packages]
# Needed by tmux when spawning macOS's system zsh as a child.
# The formula does not exist on Linux, so declare it here only.
"brew:reattach-to-user-namespace" = "latest"

# GNU coreutils-style tools missing (or shipped as BSD variants) on macOS.
# Not needed on Linux where apt/dnf ship the GNU flavor as the default awk / grep / sed.
# Available on PATH as gawk / ggrep / gsed.
"brew:gawk"    = "latest"
"brew:grep"    = "latest"
"brew:gnu-sed" = "latest"

# ---------------------------------------------------------------------------
# Login shell
# macOS ships zsh at /bin/zsh; the /usr/bin/zsh path used on Linux does not
# exist here. Prefer the system zsh over a brew-installed one so the shell
# stays in place even when Homebrew is absent or being reinstalled.
# ---------------------------------------------------------------------------
[bootstrap.user]
login_shell = "/bin/zsh"

# ---------------------------------------------------------------------------
# Homebrew casks (macOS only)
# `brew bundle` reads ~/Brewfile by default, so symlinking it here lets the
# post-packages hook run `brew bundle` without a --file flag.
# ---------------------------------------------------------------------------
[dotfiles]
"~/Brewfile" = "~/.config/mise/../home/Brewfile"

# ---------------------------------------------------------------------------
# mise-managed tools (macOS only)
# ---------------------------------------------------------------------------
[tools]
# Rust/C++ build cache. Distributed via the kunobi-ninja/kunobi tap, a personal
# tap without Homebrew API metadata, so ubi pulls the same release binary the
# formula would install (as with baretree / ftgrep in config.toml).
"github:kunobi-ninja/kache" = "latest"

# ---------------------------------------------------------------------------
# Bootstrap task
# `mise bootstrap` runs a task named `bootstrap` as its last declarative step,
# after [tools] are installed and on PATH.
# ---------------------------------------------------------------------------
[tasks.bootstrap]
description = "macOS-only post-install setup"
# Points ~/.cargo/config.toml at kache as the rustc-wrapper and installs the
# daemon as a launchd login service. Idempotent, so every bootstrap re-run
# doubles as a config repair.
run = "kache init -y"
